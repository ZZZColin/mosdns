# =============================================================
# 放到你 fork 仓库的 .github/workflows/docker-publish.yml
#
# 效果：每次推一个 v 开头的 tag（比如 v1.0.0），GitHub Actions
# 会自动构建多架构镜像并推到 Docker Hub
#
# 使用前需要做的事：
#   1. 去 Docker Hub 生成一个 Access Token（Account Settings -> Security）
#   2. 在这个 GitHub 仓库的 Settings -> Secrets and variables -> Actions 里
#      新建两个 repository secret：
#        DOCKERHUB_USERNAME  = 你的 Docker Hub 用户名
#        DOCKERHUB_TOKEN     = 刚才生成的 Access Token（不要用账号密码）
#   3. 把下面 tags 里的 "你的DockerHub用户名" 换成实际用户名
# =============================================================

name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # 也支持在 Actions 页面手动点一下触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe 需要完整的 git 历史和 tag 信息，浅克隆会拿不到版本号

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tag name
        id: vars
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            zzzcolin/mosdns:${{ steps.vars.outputs.tag }}
            zzzcolin/mosdns:latest
